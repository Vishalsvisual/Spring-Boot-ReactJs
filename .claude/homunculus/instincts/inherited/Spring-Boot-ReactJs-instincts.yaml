# Spring Boot ReactJs Workflow Add Or Update Service Layer With Exception Handling

## Action

Follow the add-or-update-service-layer-with-exception-handling workflow:
1. Edit or create service implementation file in service/impl (e.g., EmployeeService.java)
2. Edit or create exception classes (e.g., ErrorDetails.java, ResourceNotFound.java, ErrorResponse.java, ResourceNotFoundException.java)
3. Edit or update GlobalExceptionHandler.java to handle new or updated exceptions
4. Optionally update utility classes (e.g., MapperUtil.java)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: react-springboot-api/src/main/java/emp/management/service/impl/*.java, react-springboot-api/src/main/java/emp/management/exception/*.java, react-springboot-api/src/main/java/emp/management/utils/MapperUtil.java

